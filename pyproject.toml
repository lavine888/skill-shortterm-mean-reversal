[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lavine-shortterm-mean-reversal"
version = "0.6.0"
description = "Auditable Q58 five-session A-share short-term reversal factor research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = [
  "panda_data==0.0.12",
  "pandas>=2.0,<4",
  "numpy>=1.24,<3",
  "pyarrow>=14,<26",
]

[tool.setuptools.packages.find]
include = ["lavine_reversal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
