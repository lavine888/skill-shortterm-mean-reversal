name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps
      - run: python -m pytest
      - run: python scripts/validate_metadata.py
      - run: python scripts/backtest.py --provider demo --start 20220101 --end 20241231 --evidence-output output/evidence.parquet --output output/demo.json
      - run: python scripts/validate.py output/demo.json --evidence output/evidence.parquet
      - run: python scripts/package_release.py --skip-checks --destination dist
