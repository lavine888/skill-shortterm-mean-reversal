name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps
      - run: python -m pytest
      - run: python scripts/validate_metadata.py
      - run: python scripts/backtest.py --provider demo --start 20220101 --end 20241231 --evidence-output output/evidence.parquet --output output/demo.json
      - run: python scripts/validate.py output/demo.json --evidence output/evidence.parquet
      - run: python scripts/backtest.py --provider demo --accounting-mode daily_nav --start 20220101 --end 20241231 --output output/daily.json
      - run: python scripts/validate.py output/daily.json
      - run: python scripts/oos_validation.py --provider demo --start 20210101 --end 20251231 --accounting-mode daily_nav --output output/oos.json
      - run: python scripts/package_release.py --skip-checks --destination dist
